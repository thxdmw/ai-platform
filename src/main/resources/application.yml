server:
  port: ${SERVER_PORT:9900}
  forward-headers-strategy: framework
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: ai-platform
  datasource:
    url: jdbc:h2:file:./data/ai-platform;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
  flyway:
    enabled: true
    locations: classpath:db/migration
  ai:
    model:
      chat: ${AI_CHAT_PROVIDER:ollama}
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${OLLAMA_CHAT_MODEL:qwen3.5:4b}
          temperature: 0.2
    deepseek:
      api-key: ${DEEPSEEK_API_KEY:}
      chat:
        options:
          model: ${DEEPSEEK_CHAT_MODEL:deepseek-v4-flash}
          temperature: 0.2

ai-platform:
  website:
    # 公开接口只能被明确列出的首页来源调用，多个来源通过逗号分隔。
    allowed-origins: ${WEBSITE_ASSISTANT_ALLOWED_ORIGINS:http://localhost:9900,http://localhost:8080,http://127.0.0.1:8080,https://thxdxw.cn}
    # 后台口令不配置时禁止访问知识库与助手设置 API。
    access-token: ${WEBSITE_ASSISTANT_ACCESS_TOKEN:123456}
    requests-per-minute: ${WEBSITE_ASSISTANT_REQUESTS_PER_MINUTE:6}
    requests-per-client-per-day: ${WEBSITE_ASSISTANT_REQUESTS_PER_CLIENT_PER_DAY:30}
    requests-per-day: ${WEBSITE_ASSISTANT_REQUESTS_PER_DAY:300}
    sse-timeout: ${WEBSITE_ASSISTANT_SSE_TIMEOUT:90s}
  blog:
    # 博客助手只允许持有访问口令的管理员使用；生产环境不得留空。
    access-token: ${BLOG_ASSISTANT_ACCESS_TOKEN:123456}
    api-base-url: ${BLOG_API_BASE_URL:http://localhost:9090/agent/api/blog}
    api-key: ${BLOG_API_KEY:}
    connect-timeout: ${BLOG_API_CONNECT_TIMEOUT:5s}
    request-timeout: ${BLOG_API_REQUEST_TIMEOUT:30s}
    sse-timeout: ${BLOG_ASSISTANT_SSE_TIMEOUT:120s}
    approval-ttl: ${BLOG_PUBLICATION_APPROVAL_TTL:15m}
  server:
    # 页面保存的 SSH 凭据使用主密钥加密；生产环境必须配置 32 字节 Base64 密钥。
    access-token: ${SERVER_ASSISTANT_ACCESS_TOKEN:123456}
    credential-master-key: ${SERVER_CREDENTIAL_MASTER_KEY:j2A5U/kFRXFQU690r0wjGSGXprsJhVJiilBQ6Px1+os=}
    connect-timeout: ${SERVER_SSH_CONNECT_TIMEOUT:8s}
    command-timeout: ${SERVER_SSH_COMMAND_TIMEOUT:30s}
    sse-timeout: ${SERVER_ASSISTANT_SSE_TIMEOUT:10m}
    approval-ttl: ${SERVER_OPERATION_APPROVAL_TTL:10m}
    max-output-bytes: ${SERVER_SSH_MAX_OUTPUT_BYTES:16384}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    com.thx.aiplatform: INFO

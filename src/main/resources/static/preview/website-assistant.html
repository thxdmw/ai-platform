<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网站助手组件预览</title>
    <style>
        :root { font-family: Inter, "Microsoft YaHei", sans-serif; color: #172033; background: #edf5ff; }
        body { min-height: 100vh; margin: 0; background: radial-gradient(circle at 25% 10%, #fff 0, transparent 35%), linear-gradient(145deg, #edf6ff, #e9efff); }
        main { width: min(880px, calc(100% - 40px)); margin: 0 auto; padding: 80px 0; }
        h1 { margin: 0 0 14px; font-size: clamp(30px, 6vw, 56px); }
        p { max-width: 610px; color: #53627a; font-size: 17px; line-height: 1.8; }
        button { padding: 10px 14px; border: 0; border-radius: 10px; background: #172033; color: #fff; cursor: pointer; }
    </style>
</head>
<body>
<main>
    <p>AI PLATFORM / COMPONENT PREVIEW</p>
    <h1>网站助手仍然属于首页体验。</h1>
    <p>组件代码由 AI 平台统一发布，通过一行脚本嵌入首页，并保持原有右下角悬浮位置。点击机器人按钮检查打开、关闭和响应式布局。</p>
    <button id="toggle-theme" type="button">切换深色背景</button>
</main>
<script>
    document.getElementById('toggle-theme').addEventListener('click', () => {
        const root = document.documentElement;
        const dark = root.dataset.theme !== 'dark';
        root.dataset.theme = dark ? 'dark' : 'light';
        document.body.style.background = dark ? '#050b18' : '';
        document.body.style.color = dark ? '#e5edf8' : '';
    });
</script>
<script src="../widgets/website-assistant/widget.js" defer></script>
</body>
</html>
